ogen:`鹵素`,noble:`惰性氣體`,lanthanide:`鑭系元素`,actinide:`錒系元素`},Bf=[[1,`H`,`氫`,`Hydrogen`,1,1,`宇宙中含量最多、質量最輕的元素。`,`水分子與許多燃料都含有氫。`],[2,`He`,`氦`,`Helium`,1,18,`不易和其他元素反應，是很輕的惰性氣體。`,`氣球、低溫冷卻與核磁共振設備。`],[3,`Li`,`鋰`,`Lithium`,2,1,`質量很輕、反應活潑的金屬。`,`手機與電動車的鋰離子電池。`],[4,`Be`,`鈹`,`Beryllium`,2,2,`輕而堅硬，但粉塵對人體有害。`,`航太零件與特殊合金。`],[5,`B`,`硼`,`Boron`,2,13,`是類金屬，能增加玻璃的耐熱性。`,`硼矽玻璃、清潔劑與植物肥料。`],[6,`C`,`碳`,`Carbon`,2,14,`能形成非常多種化合物，是生命的重要骨架。`,`食物、鉛筆芯、鑽石與塑膠。`],[7,`N`,`氮`,`Nitrogen`,2,15,`約占空氣體積的78%。`,`食品保鮮、肥料與液態氮冷卻。`],[8,`O`,`氧`,`Oxygen`,2,16,`支援呼吸與燃燒，約占空氣體積的21%。`,`醫療用氧、呼吸與金屬切割。`],[9,`F`,`氟`,`Fluorine`,2,17,`反應性非常強，自然界多以化合物存在。`,`含氟牙膏與部分不沾塗層材料。`],[10,`Ne`,`氖`,`Neon`,2,18,`通電時會發出橘紅色光。`,`霓虹招牌與指示燈。`],[11,`Na`,`鈉`,`Sodium`,3,1,`遇水反應劇烈，因此不會以純金屬存在於食鹽中。`,`食鹽、調味料與人體體液。`],[12,`Mg`,`鎂`,`Magnesium`,3,2,`燃燒時會發出強烈白光。`,`輕合金、煙火與人體所需礦物質。`],[13,`Al`,`鋁`,`Aluminium`,3,13,`質量輕，表面氧化層能保護內部。`,`鋁罐、鋁箔、窗框與飛機。`],[14,`Si`,`矽`,`Silicon`,3,14,`是地殼中常見的類金屬，也是重要半導體材料。`,`電腦晶片、玻璃與太陽能板。`],[15,`P`,`磷`,`Phosphorus`,3,15,`是DNA、骨骼與能量傳遞的重要成分。`,`肥料、火柴與人體骨骼。`],[16,`S`,`硫`,`Sulfur`,3,16,`常見的黃色固體，能形成許多化合物。`,`肥料、橡膠加工與硫酸製造。`],[17,`Cl`,`氯`,`Chlorine`,3,17,`氯氣有毒，但適量氯化物有重要用途。`,`自來水消毒、食鹽與漂白劑。`],[18,`Ar`,`氬`,`Argon`,3,18,`空氣中含量最多的惰性氣體。`,`燈泡填充氣體與焊接保護氣。`],[19,`K`,`鉀`,`Potassium`,4,1,`是維持神經與肌肉正常運作的重要元素。`,`蔬果、肥料與人體細胞。`],[20,`Ca`,`鈣`,`Calcium`,4,2,`是骨骼與牙齒的重要成分。`,`牛奶、骨骼、石灰岩與水泥。`],[21,`Sc`,`鈧`,`Scandium`,4,3,`少量加入鋁中可製成輕而強的合金。`,`運動器材、航太合金與特殊燈具。`],[22,`Ti`,`鈦`,`Titanium`,4,4,`強度高、耐腐蝕，而且能與人體組織相容。`,`人工關節、眼鏡架與飛機。`],[23,`V`,`釩`,`Vanadium`,4,5,`少量加入鋼中可提高強度。`,`工具鋼、車輛零件與儲能電池。`],[24,`Cr`,`鉻`,`Chromium`,4,6,`能讓鋼材更耐鏽，化合物可能呈現鮮豔顏色。`,`不鏽鋼、鍍鉻與顏料。`],[25,`Mn`,`錳`,`Manganese`,4,7,`是製鋼的重要添加元素。`,`乾電池、鋼材與人體微量營養。`],[26,`Fe`,`鐵`,`Iron`,4,8,`地球核心與人體血紅素都含有鐵。`,`建築鋼材、鍋具與紅血球。`],[27,`Co`,`鈷`,`Cobalt`,4,9,`部分鈷化合物呈藍色，也是維生素B12的一部分。`,`電池、藍色顏料與耐熱合金。`],[28,`Ni`,`鎳`,`Nickel`,4,10,`耐腐蝕，常和其他金屬形成合金。`,`硬幣、不鏽鋼與充電電池。`],[29,`Cu`,`銅`,`Copper`,4,11,`導電與導熱性很好，表面久了會形成綠色銅鏽。`,`電線、水管、硬幣與鍋具。`],[30,`Zn`,`鋅`,`Zinc`,4,12,`可保護鋼鐵不易生鏽，也是人體需要的微量元素。`,`鍍鋅鐵、電池與防曬產品。`],[31,`Ga`,`鎵`,`Gallium`,4,13,`熔點很低，可能在手掌溫度下融化。`,`半導體、LED與溫度計。`],[32,`Ge`,`鍺`,`Germanium`,4,14,`具有半導體性質，能傳送紅外線。`,`光纖、紅外線鏡片與半導體。`],[33,`As`,`砷`,`Arsenic`,4,15,`有些砷化合物有強烈毒性。`,`半導體與特殊合金；不可自行接觸。`],[34,`Se`,`硒`,`Selenium`,4,16,`少量是人體需要的微量元素，過量則有害。`,`光電材料、玻璃與營養來源。`],[35,`Br`,`溴`,`Bromine`,4,17,`是常溫下少數呈液態的元素之一。`,`阻燃材料、攝影化學與藥物製造。`],[36,`Kr`,`氪`,`Krypton`,4,18,`通電時會發光，含量在空氣中很少。`,`特殊照明、閃光燈與雷射。`],[37,`Rb`,`銣`,`Rubidium`,5,1,`非常活潑，接觸空氣或水容易反應。`,`原子鐘、研究儀器與特殊玻璃。`],[38,`Sr`,`鍶`,`Strontium`,5,2,`某些鍶鹽燃燒時會呈紅色。`,`紅色煙火、磁鐵與骨骼研究。`],[39,`Y`,`釔`,`Yttrium`,5,3,`常與稀土元素一起出現。`,`LED、雷射、螢光粉與超導材料。`],[40,`Zr`,`鋯`,`Zirconium`,5,4,`耐高溫、耐腐蝕，且不易吸收中子。`,`核反應爐外殼、陶瓷刀與假鑽。`],[41,`Nb`,`鈮`,`Niobium`,5,5,`加入鋼中可提高強度，也能製成超導材料。`,`橋梁鋼材、磁振造影磁鐵與珠寶。`],[42,`Mo`,`鉬`,`Molybdenum`,5,6,`熔點高，可讓合金更耐熱。`,`工具鋼、機械零件與工業觸媒。`],[43,`Tc`,`鎝`,`Technetium`,5,7,`第一個以人工方式製得的元素，所有同位素都有放射性。`,`醫學影像檢查常使用鎝-99m。`],[44,`Ru`,`釕`,`Ruthenium`,5,8,`硬而耐磨，常用來強化其他金屬。`,`電接點、晶片製程與化學觸媒。`],[45,`Rh`,`銠`,`Rhodium`,5,9,`反光、耐腐蝕而且十分稀有。`,`汽車觸媒轉換器與珠寶鍍層。`],[46,`Pd`,`鈀`,`Palladium`,5,10,`能吸收大量氫，也是重要觸媒。`,`汽車排氣觸媒、電子零件與珠寶。`],[47,`Ag`,`銀`,`Silver`,5,11,`是導電性最好的金屬。`,`珠寶、電子接點、鏡面與抗菌材料。`],[48,`Cd`,`鎘`,`Cadmium`,5,12,`有毒且會累積於環境與人體。`,`部分電池、顏料與太陽能材料。`],[49,`In`,`銦`,`Indium`,5,13,`柔軟且熔點低，化合物可做透明導電膜。`,`觸控螢幕、液晶面板與焊料。`],[50,`Sn`,`錫`,`Tin`,5,14,`熔點較低，能保護其他金屬表面。`,`焊錫、馬口鐵罐與青銅。`],[51,`Sb`,`銻`,`Antimony`,5,15,`具有類金屬性質，常與其他材料混合使用。`,`阻燃材料、電池合金與半導體。`],[52,`Te`,`碲`,`Tellurium`,5,16,`稀有的類金屬，能改善某些合金的性質。`,`太陽能電池、熱電材料與合金。`],[53,`I`,`碘`,`Iodine`,5,17,`甲狀腺製造荷爾蒙需要少量的碘。`,`碘鹽、消毒用品與醫學影像。`],[54,`Xe`,`氙`,`Xenon`,5,18,`重而稀有的惰性氣體，通電時會發光。`,`車燈、閃光燈、離子推進器與麻醉研究。`],[55,`Cs`,`銫`,`Caesium`,6,1,`非常活潑，銫-133用來定義秒。`,`高精度原子鐘與研究設備。`],[56,`Ba`,`鋇`,`Barium`,6,2,`某些鋇化合物燃燒時呈綠色。`,`胃腸X光顯影劑、煙火與鑽井。`],[57,`La`,`鑭`,`Lanthanum`,6,null,`是鑭系元素之一，金屬柔軟且容易氧化。`,`相機鏡片、打火石與鎳氫電池。`],[58,`Ce`,`鈰`,`Cerium`,6,null,`是地殼中含量較多的稀土元素。`,`打火石、玻璃拋光粉與汽車觸媒。`],[59,`Pr`,`鐠`,`Praseodymium`,6,null,`化合物常呈綠色，可改善磁性材料。`,`強力磁鐵、玻璃著色與飛機合金。`],[60,`Nd`,`釹`,`Neodymium`,6,null,`能製成體積小、磁力很強的磁鐵。`,`耳機、硬碟、風力發電機與馬達。`],[61,`Pm`,`鉕`,`Promethium`,6,null,`具有放射性，在自然界極少。`,`主要用於研究、特殊電池與測量儀器。`],[62,`Sm`,`釤`,`Samarium`,6,null,`可形成耐高溫的強力磁鐵。`,`耳機、馬達、核反應爐與癌症治療研究。`],[63,`Eu`,`銪`,`Europium`,6,null,`部分化合物能發出鮮明紅光或藍光。`,`螢幕螢光粉、防偽標記與LED。`],[64,`Gd`,`釓`,`Gadolinium`,6,null,`具有特殊磁性，也很容易吸收中子。`,`磁振造影顯影劑、核反應爐與研究。`],[65,`Tb`,`鋱`,`Terbium`,6,null,`部分化合物能發出綠光。`,`螢光粉、感測器與磁性材料。`],[66,`Dy`,`鏑`,`Dysprosium`,6,null,`可讓強力磁鐵在高溫下維持性能。`,`電動車馬達、風力發電機與資料儲存。`],[67,`Ho`,`鈥`,`Holmium`,6,null,`具有很強的磁性，也能吸收特定波長的光。`,`雷射、磁性研究與核反應爐。`],[68,`Er`,`鉺`,`Erbium`,6,null,`鉺離子能放大光纖中的訊號。`,`光纖通訊、雷射與粉紅色玻璃。`],[69,`Tm`,`銩`,`Thulium`,6,null,`是較稀少的鑭系元素。`,`可攜式X光源、雷射與研究設備。`],[70,`Yb`,`鐿`,`Ytterbium`,6,null,`受壓時電阻會改變，可用於精密測量。`,`光纖雷射、原子鐘與合金研究。`],[71,`Lu`,`鎦`,`Lutetium`,6,null,`密度高，是鑭系中較重的元素。`,`PET掃描晶體、石油精煉觸媒與研究。`],[72,`Hf`,`鉿`,`Hafnium`,6,4,`耐高溫並且容易吸收中子。`,`核反應爐控制棒、晶片與耐熱合金。`],[73,`Ta`,`鉭`,`Tantalum`,6,5,`非常耐腐蝕，能儲存電荷。`,`手機電容、醫療植入物與耐蝕設備。`],[74,`W`,`鎢`,`Tungsten`,6,6,`是熔點最高的金屬。`,`切削工具、燈絲與高溫零件。`],[75,`Re`,`錸`,`Rhenium`,6,7,`稀有、熔點很高，可強化高溫合金。`,`噴射引擎、石油觸媒與溫度測量。`],[76,`Os`,`鋨`,`Osmium`,6,8,`是密度最高的天然元素之一。`,`耐磨合金、筆尖與研究儀器。`],[77,`Ir`,`銥`,`Iridium`,6,9,`非常耐腐蝕，隕石中的比例比地殼高。`,`火星塞、坩堝、醫療與地質研究。`],[78,`Pt`,`鉑`,`Platinum`,6,10,`稀有、耐腐蝕，也是很好的觸媒。`,`珠寶、汽車觸媒與抗癌藥物製造。`],[79,`Au`,`金`,`Gold`,6,11,`延展性與導電性良好，而且不易腐蝕。`,`珠寶、電子接點、牙科與航太設備。`],[80,`Hg`,`汞`,`Mercury`,6,12,`是常溫下呈液態的金屬，蒸氣有毒。`,`舊式溫度計、燈具與工業儀器。`],[81,`Tl`,`鉈`,`Thallium`,6,13,`柔軟但有強烈毒性。`,`電子、光學與醫學研究；生活中應避免接觸。`],[82,`Pb`,`鉛`,`Lead`,6,14,`密度高、柔軟，但會傷害神經系統。`,`鉛酸電池、輻射防護與配重。`],[83,`Bi`,`鉍`,`Bismuth`,6,15,`重金屬中毒性相對較低，結晶常呈彩虹色。`,`胃藥、低熔點合金與化妝品。`],[84,`Po`,`釙`,`Polonium`,6,16,`具有強放射性，由居禮夫婦發現。`,`主要用於科學研究與特殊靜電消除設備。`],[85,`At`,`砈`,`Astatine`,6,17,`自然界極少，所有同位素都有放射性。`,`主要用於核醫與基礎研究。`],[86,`Rn`,`氡`,`Radon`,6,18,`是放射性氣體，可能從土壤進入建築物。`,`主要用於環境監測與研究，室內需注意通風。`],[87,`Fr`,`鍅`,`Francium`,7,1,`自然界極少且放射性很強。`,`只用於科學研究，沒有日常用途。`],[88,`Ra`,`鐳`,`Radium`,7,2,`會放射輻射，歷史上曾被誤用於發光塗料。`,`現代主要用於研究與少數醫療用途。`],[89,`Ac`,`錒`,`Actinium`,7,null,`是錒系元素之一，具有強放射性。`,`放射治療與中子源研究。`],[90,`Th`,`釷`,`Thorium`,7,null,`天然放射性金屬，可作為核燃料研究材料。`,`高溫合金、舊式燈罩與核能研究。`],[91,`Pa`,`鏷`,`Protactinium`,7,null,`稀有且具有放射性。`,`主要用於科學研究，沒有日常用途。`],[92,`U`,`鈾`,`Uranium`,7,null,`天然放射性元素，可進行核分裂。`,`核能燃料、地質定年與研究。`],[93,`Np`,`錼`,`Neptunium`,7,null,`多由核反應產生，具有放射性。`,`主要用於核科學研究。`],[94,`Pu`,`鈽`,`Plutonium`,7,null,`可進行核分裂，必須在嚴格管制下處理。`,`核能、太空電源與研究。`],[95,`Am`,`鋂`,`Americium`,7,null,`人工放射性元素，能持續放出粒子。`,`部分煙霧偵測器與工業測量。`],[96,`Cm`,`鋦`,`Curium`,7,null,`以居禮夫婦命名的人工放射性元素。`,`主要用於研究與太空儀器。`],[97,`Bk`,`鉳`,`Berkelium`,7,null,`在實驗室製得，名稱來自柏克萊。`,`用來合成更重元素與進行核研究。`],[98,`Cf`,`鉲`,`Californium`,7,null,`能放出大量中子，是人工放射性元素。`,`中子源、礦物分析與研究。`],[99,`Es`,`鑀`,`Einsteinium`,7,null,`在氫彈試爆產物中首次發現。`,`只用於製造更重元素與科學研究。`],[100,`Fm`,`鐨`,`Fermium`,7,null,`以物理學家費米命名，數量極少。`,`只用於科學研究。`],[101,`Md`,`鍆`,`Mendelevium`,7,null,`以週期表建立者門得列夫命名。`,`只用於科學研究。`],[102,`No`,`鍩`,`Nobelium`,7,null,`以諾貝爾命名，是人工合成元素。`,`只用於科學研究。`],[103,`Lr`,`鐒`,`Lawrencium`,7,null,`以回旋加速器發明者勞倫斯命名。`,`只用於科學研究。`],[104,`Rf`,`鑪`,`Rutherfordium`,7,4,`以拉塞福命名，只能在實驗室製造。`,`原子一次只存在很短時間，用於研究原子核。`],[105,`Db`,`𨧀`,`Dubnium`,7,5,`以俄羅斯杜布納研究中心命名。`,`只有科學研究用途。`],[106,`Sg`,`𨭎`,`Seaborgium`,7,6,`以化學家西博格命名的人工元素。`,`只有科學研究用途。`],[107,`Bh`,`𨨏`,`Bohrium`,7,7,`以物理學家波耳命名，壽命很短。`,`只有科學研究用途。`],[108,`Hs`,`𨭆`,`Hassium`,7,8,`名稱來自德國黑森邦的拉丁文。`,`只有科學研究用途。`],[109,`Mt`,`䥑`,`Meitnerium`,7,9,`以物理學家莉澤・邁特納命名。`,`只有科學研究用途。`],[110,`Ds`,`鐽`,`Darmstadtium`,7,10,`名稱來自發現地德國達姆施塔特。`,`只有科學研究用途。`],[111,`Rg`,`錀`,`Roentgenium`,7,11,`以X光發現者侖琴命名。`,`只有科學研究用途。`],[112,`Cn`,`鎶`,`Copernicium`,7,12,`以天文學家哥白尼命名。`,`只有科學研究用途。`],[113,`Nh`,`鉨`,`Nihonium`,7,13,`名稱來自日本，是首個在亞洲命名的元素。`,`原子壽命極短，只有科學研究用途。`],[114,`Fl`,`鈇`,`Flerovium`,7,14,`以俄羅斯弗廖羅夫核反應實驗室命名。`,`原子壽命極短，只有科學研究用途。`],[115,`Mc`,`鏌`,`Moscovium`,7,15,`名稱來自莫斯科州，是人工合成元素。`,`原子壽命極短，只有科學研究用途。`],[116,`Lv`,`鉝`,`Livermorium`,7,16,`以美國勞倫斯利佛摩國家實驗室命名。`,`原子壽命極短，只有科學研究用途。`],[117,`Ts`,`鿬`,`Tennessine`,7,17,`名稱來自美國田納西州，屬於第17族。`,`原子壽命極短，只有科學研究用途。`],[118,`Og`,`鿫`,`Oganesson`,7,18,`以核物理學家奧加涅相命名，是目前原子序最大的已命名元素。`,`原子壽命極短，只有科學研究用途。`]],Vf={alkali:new Set([3,11,19,37,55,87]),alkaline:new Set([4,12,20,38,56,88]),metalloid:new Set([5,14,32,33,51,52]),nonmetal:new Set([1,6,7,8,15,16,34]),halogen:new Set([9,17,35,53,85,117]),noble:new Set([2,10,18,36,54,86,118]),post:new Set([13,31,49,50,81,82,83,84,11
